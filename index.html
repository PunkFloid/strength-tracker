<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Strength">
  <title>Strength Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main data-tab="overview">
    <h1>Strength <span class="dot">Tracker</span></h1>
    <p class="muted">Přetáhni sem export z MacroFactoru, starý export (.csv) nebo zálohu (.json).</p>

    <div id="importMsg"></div>
    <div id="dropzone" class="dropzone">
      <strong>Přetáhni soubor sem</strong>
      <span>nebo klepni a vyber soubor</span>
      <input id="fileInput" type="file" accept=".csv,.xlsx,.json" multiple hidden>
    </div>
    <div id="strength"></div>
    <div id="e1rm"></div>
    <div id="bodycomp"></div>
    <div id="sync"></div>
    <div id="storage"></div>
    <div id="merged"></div>
    <div id="results"></div>
    <div id="coach"></div>
    <p class="muted note" id="appVersion">Verze v12 · stagnace 3 týdny / 3 měsíce a stagnace svalů</p>
  </main>

  <script src="parser.js"></script>
  <script src="exercises.js"></script>
  <script src="normalize.js"></script>
  <script src="e1rm.js"></script>
  <script src="muscles.js"></script>
  <script src="strength.js"></script>
  <script src="body.js"></script>
  <script src="linechart.js"></script>
  <script src="storage.js"></script>
  <script src="sync.js"></script>
  <script src="bplus-tuning.js"></script>
  <script src="app.js"></script>
  <script src="coach.js"></script>
  <script>
    // offline režim
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker se nezaregistroval:', err));
      });
    }
  </script>
</body>
</html>
